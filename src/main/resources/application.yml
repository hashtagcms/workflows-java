spring:
  application:
    name: hashtagcms-workflows-java

  # Default: in-memory H2. Swap the datasource + driver for MySQL/Postgres.
  datasource:
    url: jdbc:h2:mem:workflows;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate.format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

hashtagcms:
  workflows:
    master-site-id: 1
    # Base API route prefix (like PHP's hashtagcmsapi.route_prefix). Public routes
    # live at {route-prefix}/public/workflows/v1, management at {route-prefix}/admin.
    route-prefix: /api/hashtagcms
    expose-error-details: false
    negotiation:
      enabled: true
    install:
      seed-directives: true
      seed-examples: true
    auth:
      driver: header                  # header (trusted gateway) | sanctum (shared DB) | jwt (external IdP / SSO)
      enforce-required: true          # reject `auth_required` workflows when no user resolves (401)
      id-header: X-User-Id            # trusted headers used by the `header` driver
      email-header: X-User-Email
      name-header: X-User-Name
      # --- `jwt` driver (external SSO / OIDC): set driver=jwt and configure one key source ---
      # jwt:
      #   jwks-uri: https://YOUR_DOMAIN/.well-known/jwks.json   # RS/ES/PS tokens (Auth0, Keycloak, Cognito, Okta, Azure AD, Google)
      #   # secret: <shared-secret>                             # ...or HS* tokens (use instead of jwks-uri)
      #   issuer: https://YOUR_DOMAIN/                          # expected `iss` (recommended)
      #   audience: your-api-identifier                         # expected `aud` (optional)
      #   id-claim: sub                                         # claim -> user.id
      #   email-claim: email                                    # claim -> user.email
      #   name-claim: name                                      # claim -> user.name
      #   link-by-email: false                                  # map the SSO email to a local users row for a numeric id

# --- Shared HashtagCMS database (activate with -Dspring-boot.run.profiles=shared) ---
# Java operates on the SAME workflow tables as PHP and authenticates against the
# shared Sanctum tables. PHP owns the schema, so Hibernate only validates.
---
spring:
  config:
    activate:
      on-profile: shared
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/v30?useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate

hashtagcms:
  workflows:
    auth:
      driver: sanctum          # validate Authorization: Bearer against personal_access_tokens
    install:
      seed-directives: false   # PHP owns the workflow data in the shared DB
      seed-examples: false
