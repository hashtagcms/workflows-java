spring:
  application:
    name: workflows-java

  # Default: in-memory H2. Swap the datasource + driver for MySQL/Postgres.
  datasource:
    url: jdbc:h2:mem:workflows;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate.format_sql: false

  h2:
    console:
      # Off by default (safe for a published image/library). Enable for local dev
      # on H2 with:  SPRING_H2_CONSOLE_ENABLED=true  (or -Dspring.h2.console.enabled=true)
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

server:
  port: 8080

# Actuator (active only when spring-boot-starter-actuator is on the classpath — it is
# for the standalone runner / Docker image, optional for library consumers).
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true      # exposes /actuator/health/liveness and /actuator/health/readiness (k8s)
      show-details: never  # don't leak internals on the public port; raise to when-authorized/always in trusted setups

hashtagcms:
  workflows:
    master-site-id: 1
    # Enable the docs/links homepage for the standalone runner (hit /)
    docs:
      enabled: true
    # Base API route prefix (like PHP's hashtagcmsapi.route_prefix). Public routes
    # live at {route-prefix}/public/workflows/v1, management at {route-prefix}/admin.
    route-prefix: /api/hashtagcms
    expose-error-details: false
    negotiation:
      enabled: true
    install:
      seed-directives: true
      seed-examples: true
      # Opt-in companion workflow that *obtains* a token from an external login API
      # (WORKFLOW_LOGIN_TEST). Off by default (targets a specific host); enable it
      # and point login-test-url at your environment. See docs/sso-providers.md.
      seed-login-test: false
      login-test-url: "https://auth.example.com/api/hashtagcms/public/user/v1/login"
    # Egress controls for the `http` target adapter (SSRF hardening). A target's
    # url can interpolate request-supplied {{ payload.* }} values, so restrict it
    # when workflow configs are authored by less-trusted users.
    http:
      allowed-hosts: []               # empty = any host; else exact or ".example.com" / "*.example.com"
      block-private-networks: false   # true = block loopback/private/link-local + 169.254.169.254
      connect-timeout-ms: 10000
      read-timeout-ms: 10000          # a target's own `timeout` (seconds) overrides this
      max-retries: 0                  # retries (idempotent requests only) on IOException / 429 / 5xx
      retry-backoff-ms: 200
    auth:
      driver: header                  # header (trusted gateway) | sanctum (shared DB) | jwt (external IdP / SSO)
      enforce-required: true          # reject `auth_required` workflows when no user resolves (401)
      id-header: X-User-Id            # trusted headers used by the `header` driver
      email-header: X-User-Email
      name-header: X-User-Name
      # --- `jwt` driver (external SSO / OIDC): set driver=jwt and configure one key source ---
      # jwt:
      #   jwks-uri: https://YOUR_DOMAIN/.well-known/jwks.json   # RS/ES/PS tokens (Auth0, Keycloak, Cognito, Okta, Azure AD, Google)
      #   # secret: <shared-secret>                             # ...or HS* tokens (use instead of jwks-uri)
      #   issuer: https://YOUR_DOMAIN/                          # expected `iss` (recommended)
      #   audience: your-api-identifier                         # expected `aud` (optional)
      #   id-claim: sub                                         # claim -> user.id
      #   email-claim: email                                    # claim -> user.email
      #   name-claim: name                                      # claim -> user.name
      #   link-by-email: false                                  # map the SSO email to a local users row for a numeric id

# --- Shared HashtagCMS database (activate with -Dspring-boot.run.profiles=shared) ---
# Java operates on the SAME workflow tables as PHP and authenticates against the
# shared Sanctum tables. PHP owns the schema, so Hibernate only validates.
---
spring:
  config:
    activate:
      on-profile: shared
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/v30?useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false           # never expose the H2 console when running on a real (shared) DB

hashtagcms:
  workflows:
    auth:
      driver: sanctum          # validate Authorization: Bearer against personal_access_tokens
    install:
      seed-directives: false   # PHP owns the workflow data in the shared DB
      seed-examples: false
