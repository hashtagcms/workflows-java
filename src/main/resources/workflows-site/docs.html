<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs · HashtagCMS Workflows (Java)</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1b1f24; --muted:#5b6570;
    --line:#e6e9ee; --accent:#2f6feb; --chip:#eef2f8;
    --code-bg:#0b1020; --code-ink:#e6e9ef; --tableh:#f2f5fa;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1117; --panel:#151b23; --ink:#e6edf3; --muted:#9aa7b4;
      --line:#232c37; --accent:#4f8cff; --chip:#1c2530;
      --code-bg:#0a0e14; --code-ink:#dfe7f0; --tableh:#1c2530;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.65 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px}
  @media (max-width:820px){aside{border-right:0;border-bottom:1px solid var(--line)}}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8a4fff);
    display:grid;place-items:center;color:#fff;font-weight:700}
  .brand b{font-size:14px}
  nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);font-size:14px}
  nav a:hover{background:var(--chip);text-decoration:none}
  nav a.active{background:var(--accent);color:#fff}
  nav .grouphead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:16px 0 6px 10px}
  main{padding:34px 40px 80px;max-width:820px;overflow-x:auto}
  @media (max-width:820px){main{padding:24px 18px 60px}}
  .home{font-size:13px;color:var(--muted);margin-bottom:18px;display:inline-block}
  article h1{font-size:28px;letter-spacing:-.3px;margin:.2em 0 .6em}
  article h2{font-size:21px;margin:1.6em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
  article h3{font-size:17px;margin:1.4em 0 .4em}
  article p,article li{color:var(--ink)}
  article code{background:var(--chip);padding:1px 6px;border-radius:6px;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  article pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;
    border-radius:10px;overflow-x:auto}
  article pre code{background:none;padding:0;color:inherit;font-size:12.5px}
  article table{border-collapse:collapse;width:100%;margin:1em 0;font-size:14px;display:block;overflow-x:auto}
  article th,article td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  article th{background:var(--tableh)}
  article blockquote{margin:1em 0;padding:.4em 1em;border-left:3px solid var(--accent);
    background:var(--chip);border-radius:0 8px 8px 0;color:var(--muted)}
  article img{max-width:100%}
  .err{color:#c0392b}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand"><div class="logo">#</div><b>Workflows Docs</b></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <a class="home" href="/">← Home</a>
    <article id="content">Loading…</article>
  </main>
</div>

<script src="/site-assets/marked.min.js"></script>
<script>
  // The guide list (kept in step with docs/README.md).
  var GUIDES = [
    {group:"Start here", items:[
      {file:"README.md",             title:"Overview"},
      {file:"getting-started.md",    title:"Getting started"},
      {file:"configuration.md",      title:"Configuration"},
    ]},
    {group:"Run & ship", items:[
      {file:"docker.md",             title:"Docker"},
      {file:"compatibility.md",      title:"Compatibility"},
      {file:"publishing.md",         title:"Publishing"},
    ]},
    {group:"Identity", items:[
      {file:"authentication.md",     title:"Authentication & SSO"},
      {file:"sso-providers.md",      title:"SSO / external-login providers"},
    ]},
    {group:"Build on it", items:[
      {file:"extending.md",          title:"Extending"},
      {file:"CHANGELOG.md",          title:"Changelog"},
    ]},
  ];
  var VALID = {};
  GUIDES.forEach(function(g){ g.items.forEach(function(i){ VALID[i.file]=i.title; }); });
  var DEFAULT_DOC = "README.md";

  // Links inside docs that point above /docs (project overview / changelog).
  var UP_MAP = { "../README.md":"__home__", "../CHANGELOG.md":"CHANGELOG.md" };

  function currentDoc(){
    var p = new URLSearchParams(location.search).get("doc") || DEFAULT_DOC;
    return VALID[p] ? p : DEFAULT_DOC;
  }

  function buildNav(active){
    var nav = document.getElementById("nav"), html = "";
    GUIDES.forEach(function(g){
      html += '<div class="grouphead">'+g.group+'</div>';
      g.items.forEach(function(i){
        var cls = i.file===active ? ' class="active"' : '';
        html += '<a'+cls+' href="/docs.html?doc='+encodeURIComponent(i.file)+'">'+i.title+'</a>';
      });
    });
    nav.innerHTML = html;
  }

  // Rewrite relative .md links so they stay inside the viewer.
  function rewriteLinks(root){
    root.querySelectorAll("a[href]").forEach(function(a){
      var href = a.getAttribute("href");
      if(!href) return;
      if(/^(https?:|mailto:|#)/.test(href)) return;        // external / anchor — leave
      var mapped = UP_MAP[href];
      if(mapped==="__home__"){ a.setAttribute("href","/"); return; }
      if(mapped){ a.setAttribute("href","/docs.html?doc="+encodeURIComponent(mapped)); return; }
      var base = href.split("#")[0].split("/").pop();       // basename
      if(/\.md$/i.test(base) && VALID[base]){
        var hash = href.indexOf("#")>=0 ? href.slice(href.indexOf("#")) : "";
        a.setAttribute("href","/docs.html?doc="+encodeURIComponent(base)+hash);
      }
    });
  }

  function render(md){
    var el = document.getElementById("content");
    try{
      marked.setOptions({gfm:true, breaks:false, headerIds:true, mangle:false});
      el.innerHTML = marked.parse(md);
      rewriteLinks(el);
      document.title = (VALID[currentDoc()]||"Docs") + " · Workflows (Java)";
    }catch(e){
      el.innerHTML = '<p class="err">Could not render this document.</p>';
    }
  }

  function load(){
    var doc = currentDoc();
    buildNav(doc);
    fetch("/docs/"+encodeURIComponent(doc), {headers:{Accept:"text/plain"}})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(render)
      .catch(function(){
        document.getElementById("content").innerHTML =
          '<p class="err">Document not found: '+doc+'</p>';
      });
  }

  window.addEventListener("popstate", load);
  load();
</script>
</body>
</html>
