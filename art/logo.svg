<svg width="640" height="180" viewBox="0 0 640 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HashtagCMS Workflows">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Icon tile -->
  <g transform="translate(30,30)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#tile)"/>

    <!-- connectors: trigger -> success (up), trigger -> failure (down) -->
    <path d="M46 60 C64 60 66 40 82 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.95"/>
    <path d="M46 60 C64 60 66 80 82 80" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- trigger node -->
    <circle cx="36" cy="60" r="11" fill="#ffffff"/>
    <!-- branch nodes -->
    <circle cx="90" cy="40" r="8" fill="#ffffff"/>
    <circle cx="90" cy="80" r="8" fill="#ffffff" fill-opacity="0.65"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(178,0)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="82" font-size="40" font-weight="700" fill="#1E1B4B" letter-spacing="-0.5">Workflows</text>
    <text x="2" y="112" font-size="16.5" font-weight="500" fill="#8B5CF6" letter-spacing="2.5">HASHTAGCMS</text>
    <text x="2" y="134" font-size="13" font-weight="400" fill="#64748B" letter-spacing="0.2">Server-driven action orchestration engine</text>
  </g>
</svg>
